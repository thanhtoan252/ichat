server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API's own validator rejects anything over 20MB with a readable message;
    # leaving headroom here keeps nginx from answering with a bare 413 first.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # `^~` stops nginx from testing the regex location below, so an API path that
    # happens to end in .json or .svg is still proxied instead of looked up on disk.
    location ^~ /api/ {
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/ichat-proxy.inc;
    }

    location ^~ /health/ {
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/ichat-proxy.inc;
    }

    # Hashed filenames from the production build are safe to cache forever.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must never be cached, or a deploy leaves clients on stale bundles.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
