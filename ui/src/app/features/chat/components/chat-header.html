<button hlmSidebarTrigger class="size-8"></button>

<hlm-separator orientation="vertical" class="mx-1 h-5 self-center" />

<h1 class="min-w-0 flex-1 truncate text-sm font-medium">{{ title() }}</h1>

@if (sourceCount() > 0) {
  <button
    hlmBtn
    variant="outline"
    size="sm"
    class="gap-2"
    [attr.aria-pressed]="sourcesOpen()"
    (click)="toggleSources.emit()"
  >
    <ng-icon name="lucideBookOpen" class="text-sm" />
    <span class="hidden sm:inline">Sources</span>
    <span class="tabular-nums">{{ sourceCount() }}</span>
  </button>
}
