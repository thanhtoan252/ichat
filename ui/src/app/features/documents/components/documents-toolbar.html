<button hlmSidebarTrigger class="size-8"></button>
<hlm-separator orientation="vertical" class="mx-1 h-5 self-center" />
<h1 class="flex-1 truncate text-sm font-medium">Knowledge base</h1>

@if (canManage()) {
  <!-- The label collapses on a phone, so the button carries its own name. -->
  <button
    hlmBtn
    variant="outline"
    size="sm"
    class="gap-2"
    aria-label="Reindex all documents"
    (click)="reindex.emit()"
  >
    <ng-icon name="lucideRefreshCw" class="text-sm" />
    <span class="hidden sm:inline">Reindex all</span>
  </button>

  <button hlmBtn size="sm" class="gap-2" (click)="picker.click()">
    <ng-icon name="lucideUpload" class="text-sm" />
    Upload
  </button>

  <input
    #picker
    type="file"
    class="hidden"
    multiple
    accept=".pdf,.docx,.doc,.md,.txt"
    (change)="onPicked(picker)"
  />
}
