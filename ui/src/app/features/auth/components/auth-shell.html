<div class="w-full max-w-sm">
  <div class="flex flex-col items-center gap-2.5 text-center">
    <span
      class="bg-primary text-primary-foreground grid size-10 shrink-0 place-items-center rounded-xl"
    >
      <ng-icon name="lucideSparkles" class="text-lg" />
    </span>
    <div class="grid gap-1">
      <h1 class="text-lg font-semibold tracking-tight">{{ heading() }}</h1>
      <p class="text-muted-foreground text-xs">{{ subheading() }}</p>
    </div>
  </div>

  <div class="bg-card mt-6 rounded-xl border p-5">
    <ng-content />
  </div>
</div>
